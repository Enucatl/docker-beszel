services:
  beszel:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-small
    image: henrygd/beszel:0.19.0
    cpu_shares: 128
    environment:
      APP_URL: https://beszel.${DOCKER_DOMAIN}
      # Ensure Go trusts the mounted homelab CA when calling Authelia OIDC
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    expose:
      - "8090"
    # Distroless image: use built-in health CMD (hits /api/health). Prefer ≥60s interval.
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - beszel_data:/beszel_data
      # Native Beszel system inventory. Tokens remain in the persistent DB.
      - ./config.yml:/beszel_data/config.yml:ro
      # Trust FreeIPA/homelab CA so hub can call Authelia OIDC token/userinfo over HTTPS
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - traefik_proxy
      - beszel_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      # Human UI — LAN allowlist + Authelia OIDC (app SSO, same pattern as Grafana)
      - "traefik.http.routers.beszel.rule=Host(`beszel.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.beszel.entrypoints=https"
      - "traefik.http.routers.beszel.tls=true"
      - "traefik.http.routers.beszel.middlewares=secured@file"
      - "traefik.http.routers.beszel.service=beszel"
      # Agents (all hosts, including docker) — no Authelia; path-limited; LAN allowlist only
      - "traefik.http.routers.beszel-agent.rule=Host(`beszel-agent.${DOCKER_DOMAIN}`) && PathPrefix(`/api/beszel/agent-connect`)"
      - "traefik.http.routers.beszel-agent.entrypoints=https"
      - "traefik.http.routers.beszel-agent.tls=true"
      - "traefik.http.routers.beszel-agent.priority=100"
      - "traefik.http.routers.beszel-agent.middlewares=secured@file"
      - "traefik.http.routers.beszel-agent.service=beszel"
      - "traefik.http.services.beszel.loadbalancer.server.port=8090"

  alerts-init:
    build:
      context: .
      dockerfile: alerts/Dockerfile
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-tiny
    user: "1000:1000"
    restart: "no"
    depends_on:
      beszel:
        condition: service_healthy
    environment:
      BESZEL_URL: http://beszel:8090
      BESZEL_ADMIN_EMAIL: admin@docker.home.arpa
      BESZEL_ADMIN_PASSWORD_FILE: /run/secrets/beszel_admin_password
      ALERTS_CONFIG: /app/alerts.yml
    secrets:
      - beszel_admin_password
    volumes:
      - ./alerts.yml:/app/alerts.yml:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - beszel_internal

volumes:
  beszel_data:

networks:
  traefik_proxy:
    external: true
  beszel_internal:
    internal: true

secrets:
  beszel_admin_password:
    file: secrets/beszel_admin_password
